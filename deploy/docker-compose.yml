services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cronhive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/cronhive
      PORT: "8080"
      ENVIRONMENT: production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["./bin/scheduler"]
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/cronhive
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: ["./bin/worker"]
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/cronhive
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
